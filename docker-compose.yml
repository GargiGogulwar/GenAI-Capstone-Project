
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: kraivor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kraivor}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kraivor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c log_min_duration_statement=1000

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: kraivor-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-kraivor_redis_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kraivor_redis_2024}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: kraivor-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: "none"
    profiles:
      - dev

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kraivor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  identity:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: kraivor-identity
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: auth.settings.production
      SECURE_SSL_REDIRECT: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kraivor}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      - ./.keys:/app/.keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kraivor}"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      DYNAMODB_LOCAL: "true"
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
    volumes:
      - ./.keys:/app/.keys:ro
    ports:
      - "8002:8002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  analysis:
    build:
      context: ./services/analysis
      dockerfile: Dockerfile
    container_name: kraivor-analysis
    env_file:
      - .env
    environment:
      ANALYSIS_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:-kraivor}@postgres:5432/${POSTGRES_DB:-kraivor}"
      ANALYSIS_REDIS__URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      ANALYSIS_CELERY__BROKER__URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      ANALYSIS_CELERY__RESULT__BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      ANALYSIS_KAFKA__BOOTSTRAP__SERVERS: kafka:9094
      ANALYSIS_IDENTITY__JWKS__URL: http://identity:8001/.well-known/jwks.json
      ANALYSIS_JWT__INTERNAL_REQUEST_SECRET: ${INTERNAL_REQUEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8003:8003"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: kraivor-ai
    env_file:
      - .env
    environment:
      AI_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:-kraivor}@postgres:5432/${POSTGRES_DB:-kraivor}"
      AI_REDIS__URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      AI_CELERY__BROKER__URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      AI_CELERY__RESULT__BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      AI_KAFKA__BOOTSTRAP__SERVERS: kafka:9094
      AI_IDENTITY__JWKS__URL: http://identity:8001/.well-known/jwks.json
      AI_OPENROUTER__MASTER__KEY: ${OPENROUTER_API_KEY}
      AI_GROQ_API_KEY: ${GROQ_API_KEY:-${AI_GROQ_API_KEY:-}}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY}
      AI_INTERNAL_REQUEST_SECRET: ${INTERNAL_REQUEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  core-worker:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-worker
    command: celery -A core.celery_app worker -Q notifications,default --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kraivor}"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      disable: true
    restart: unless-stopped

  core-beat:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-beat
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kraivor}"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      disable: true
    restart: unless-stopped

  core-consumer:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-consumer
    command: python manage.py consume_events
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kraivor}"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      disable: true
    restart: unless-stopped

  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
    container_name: kraivor-dynamodb
    ports:
      - "8007:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kraivor-frontend
    env_file:
      - .env
    environment:
      AI_API_URL: http://ai:8004
    ports:
      - "3000:3000"
    depends_on:
      - identity
      - core
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: kraivor-nginx
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - ./infra/docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity:
        condition: service_healthy
      core:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: kraivor_postgres_data
  redis_data:
    name: kraivor_redis_data
  kafka_data:
    name: kraivor_kafka_data
  dynamodb_data:
    name: kraivor_dynamodb_data
